<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Hanoi</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link rel='stylesheet' type='text/css' media='screen' href='style.css'>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script src='script.js' type="module" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sankofa+Display&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <img class="clublogo" src="https://clubexcel.co.in/_next/image?url=%2Fclubexcellogo.png&w=96&q=75" alt="">
    <div class="title">Tower of Hanoi</div>
    <div class="left-sidebar">
      <div class="new-game">
        <select name="discs" id="discSelect">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
        <button id="newGameBtn">New Game</button>
      </div>
      <!-- <div class="buttons">
        <button id="btnSolve">Solve</button>
      </div> -->
    </div>
    <div class="stage glass">
      <div class="step-counter">
        <p>Steps: <span id="stepCount">0</span></p>
      </div>
      <div class="tower">
        <div class="stem"></div>
        <div class="plate"></div>
      </div>
      <div class="tower">
        <div class="stem"></div>
        <div class="plate"></div>
      </div>
      <div class="tower">
        <div class="stem"></div>
        <div class="plate"></div>
      </div>
    </div>
  </div>
</body>
</html>
